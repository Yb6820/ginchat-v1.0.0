{{define "/chat/group.shtml"}}
<div id="tabbar-group" class="mui-control-content" v-show="win=='main'">
    <header class="mui-bar mui-bar-nav">
        <a class="mui-icon mui-icon-plusempty mui-pull-right" @tap="createCom"></a>
        <h1 class="mui-title">群聊</h1>
    </header>
    <ul class="mui-table-view mui-table-view-chevron" v-if="communitys.length">
        <li v-for="item in communitys" class="mui-table-view-cell mui-media" @tap="groupmsg(item)">
            <a class="mui-navigate-right">
                <img class="mui-media-object mui-pull-left" :src="item.Img || '/asset/images/community.png'">
                <div class="mui-media-body">
                    <span v-text="item.Name+'('+item.ID+')'"></span>
                    <p class='mui-ellipsis' v-text="item.Desc"></p>
                </div>
            </a>
        </li>
    </ul>
    <div v-else class="mui-content-padded" style="text-align: center;margin-top: 100px;">
        <p>还没有群聊,点击右上角创建或去“我的”加入群吧</p>
    </div>
</div>
{{end}}
