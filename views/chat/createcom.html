{{define "/chat/createcom.shtml"}}
<div id="tabbar-community" class="mui-control-content" v-show="win=='community'">
    <header class="mui-bar mui-bar-nav">
        <a class="mui-icon mui-icon-left-nav mui-pull-left" @tap="goBack"></a>
        <h1 class="mui-title">创建群</h1>
    </header>
    <ul class="mui-table-view mui-table-view-chevron">
        <li class="mui-table-view-cell mui-media">
            <a class="mui-navigate-right">
                <input style="width: 100%;height: 48px;position: absolute;opacity:0;" onchange="uploadthis(this)" accept="image/png,image/jpeg" type="file" class="mui-input-clear mui-input">
                <img id="icon" :src="com.icon" style="border-radius:50%;" class="mui-media-object mui-pull-right head-img">
                <div class="mui-media-body">
                    头像
                    <p class="mui-ellipsis">点击右侧上传头像</p>
                </div>
            </a>
        </li>
    </ul>
    <div class="mui-input-group">
        <div class="mui-input-row">
            <label>名称</label>
            <input v-model="com.name" type="text" class="mui-input-clear mui-input" placeholder="请输入群名称">
        </div>
        <div class="mui-input-row">
            <label>介绍</label>
            <textarea v-model="com.desc" rows="3" placeholder="群描述"></textarea>
        </div>
    </div>
    <div class="mui-content-padded">
        <button @tap="createcommunity" class="mui-btn mui-btn-block mui-btn-primary">确认</button>
    </div>
</div>
<style>
    #tabbar-community .mui-input-group {
        margin-top: 20px;
    }

    #tabbar-community .mui-input-row label {
        width: 22%;
    }

    #tabbar-community .mui-input-row label~input,
    #tabbar-community .mui-input-row label~textarea {
        width: 78%;
    }

    #tabbar-community .mui-content-padded {
        margin-top: 25px;
    }
</style>
<script>
    function uploadthis(dom) {
        var data = new FormData();

        for (let file of dom.files) {
            data.append('file', file);
        }

        let xhr = new XMLHttpRequest();
        xhr.onreadystatechange = function() {
            if (xhr.readyState == 4 && xhr.status == 200) {
                var res = JSON.parse(xhr.responseText);
                if (res.Code != 0) {
                    mui.toast(res.Msg)
                } else {
                    app.com.icon = res.Data;
                    mui.toast("上传成功")
                }
            }
        };
        xhr.open('POST', '/attach/upload');
        xhr.send(data)
    }
</script>
{{end}}
